<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Network | Connection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #c82de3;
            --bg: #050505;
            --card: #0f0f0f;
            --border: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 {
            font-weight: 900;
            font-size: 2rem;
            margin-bottom: 30px;
            letter-spacing: -1px;
            text-align: center;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
        }

        .label { color: #666; font-size: 0.8rem; text-transform: uppercase; }
        .value { color: var(--accent); font-weight: bold; }

        /* The Image/PNG Area */
        .image-placeholder {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px dashed #333;
            border-radius: 12px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #444;
            transition: 0.3s;
        }

        .image-placeholder:hover {
            border-color: var(--accent);
            color: #666;
        }

        .image-placeholder i {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .ps-cmd {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #ccc;
            border: 1px solid #1a1a1a;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Connection</h1>

    <div class="data-row">
        <span class="label">Host</span>
        <span class="value">connect.moonnetwork.online</span>
    </div>
    <div class="data-row">
        <span class="label">Port</span>
        <span class="value">9000</span>
    </div>
    <div class="data-row">
        <span class="label">Method</span>
        <span class="value">Telnet / RAW TCP</span>
    </div>

    <div class="ps-cmd">
        <span style="color: var(--accent)">PS &gt;</span> ncat connect.moonnetwork.online 9000
    </div>

    <div class="image-placeholder" style="padding: 10px; overflow: hidden;">
    <img src="setup.png" alt="PuTTY Configuration" style="width: 100%; height: 100%; object-fit: contain; border-radius: 8px;">
</div>
    
</div>
</div>

</body>
</html>
